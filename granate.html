  if (t.matches('[data-acct]')) { const a = UI.cfgDraft.docs.cuentas[+t.dataset.i]; a[t.dataset.acct] = t.value; if (t.dataset.acct === 'cci') { const n = t.value.replace(/\D/g, '').length, h = $(`#ac-ch-${t.dataset.i}`); if (h) { h.textContent = n === 20 ? '20 dígitos' : `${n} de 20 dígitos`; h.className = `hint ${n && n !== 20 ? 'bad' : ''}`; } } cfgChanged(false); refreshPs(); return; }
  if (!E || !t.closest('#ed, #ed-cli')) return;
  if (t.matches('[data-cliq]')) { E.cliQ = t.value; comboIdx = -1; queryPadron(); renderCombo(); return; }
  if (t.matches('[data-it]')) { const it = E.doc.items[+t.dataset.i], f = t.dataset.it; it[f] = ['cant', 'precio'].includes(f) ? num(t.value) : t.value; markDirty(); refreshCalc(); return; }
  if (t.matches('[data-cli]')) { E.doc.cliente[t.dataset.cli] = t.value; if (t.dataset.cli === 'numDoc') { const h = $('#cli-num-hint'); if (h) h.innerHTML = docHint(E.doc.cliente); autoPadron('ed'); } markDirty(); refreshCalc(); return; }
  if (t.matches('[data-cuota]')) { const q = E.doc.cuotas[+t.dataset.i]; q[t.dataset.cuota] = t.dataset.cuota === 'monto' ? num(t.value) : t.value; markDirty(); refreshCalc(); return; }
  if (t.matches('[data-ref]')) { E.doc.ref[t.dataset.ref] = t.value; markDirty(); refreshCalc(); return; }
  if (t.matches('[data-ed]')) { E.doc[t.dataset.ed] = t.value; markDirty(); refreshCalc(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.matches('[data-mprod]') && t.tagName === 'SELECT') { UI.mProd[t.dataset.mprod] = t.value; return; }
  if (t.matches('[data-cfg]') && t.tagName === 'SELECT') { setPath(UI.cfgDraft, t.dataset.cfg, t.hasAttribute('data-num') ? num(t.value) : t.value); cfgChanged(false); return; }
  if (t.matches('[data-cfg-bool]')) { setPath(UI.cfgDraft, t.dataset.cfgBool, t.checked); cfgChanged(false); if (UI.route === 'personalizar') refreshPs(); return; }
  if (t.matches('[data-logo]')) { processLogo(t.files && t.files[0]); t.value = ''; return; }
  if (t.matches('[data-acct]') && t.tagName === 'SELECT') { UI.cfgDraft.docs.cuentas[+t.dataset.i][t.dataset.acct] = t.value; cfgChanged(false); refreshPs(); return; }
  if (t.matches('[data-acct-bool]')) { UI.cfgDraft.docs.cuentas[+t.dataset.i][t.dataset.acctBool] = t.checked; cfgChanged(false); refreshPs(); return; }
  if (t.matches('[data-blk]')) { const P = UI.cfgDraft.docs[UI.psTipo || 'cot'], k = t.dataset.blk; P.ocultos = t.checked ? P.ocultos.filter(x => x !== k) : [...new Set([...P.ocultos, k])]; t.closest('.blk')?.classList.toggle('off', !t.checked); cfgChanged(false); refreshPs(); return; }
  if (t.matches('[data-cfg-radio]')) { setPath(UI.cfgDraft, t.dataset.cfgRadio, t.value); cfgChanged(true); return; }
  if (!E) return;
  if (t.matches('[data-savecli]')) { E.saveCli = t.checked; return; }
  if (t.matches('[data-ed-bool]')) {
    const d = E.doc, on = t.checked, rate = d.igvRate;
    d.items.forEach(it => { if (it.afect === '10') it.precio = r2(on ? num(it.precio) * (1 + rate) : num(it.precio) / (1 + rate)); });
    d.incluyeIGV = on; markDirty(); reItems(); return;
  }
  if (t.matches('[data-it]') && t.tagName === 'SELECT') { E.doc.items[+t.dataset.i][t.dataset.it] = t.value; markDirty(); refreshCalc(); return; }
  if (t.matches('[data-ref]') && t.tagName === 'SELECT') { E.doc.ref[t.dataset.ref] = t.value; markDirty(); refreshCalc(); return; }
  if (t.matches('[data-ed="fecha"]') && E.doc.formaPago === 'Credito') { rePago(); }
});
document.addEventListener('mousedown', ev => { if (ev.target.closest('.combo-list')) ev.preventDefault(); });
document.addEventListener('focusin', ev => { if (ev.target.id === 'cli-q') renderCombo(); });
document.addEventListener('focusout', ev => {
  if (ev.target.id === 'cli-q') setTimeout(() => { if (!document.activeElement?.closest('.combo')) closeCombo(); }, 260);
  if (UI.pendingRender && $('#main').contains(ev.target)) setTimeout(() => { const a = document.activeElement; if (UI.pendingRender && !(a && $('#main').contains(a) && a.matches('input:not([data-search]),textarea,select'))) render(); }, 0);
});
// tooltip del gráfico
document.addEventListener('pointerover', ev => {
  const h = ev.target.closest('.chart [data-tip]'); if (!h) return;
  const ch = h.closest('.chart'), tip = ch.querySelector('.tip'), svg = ch.querySelector('svg');
  const vb = svg.viewBox.baseVal, rs = svg.getBoundingClientRect(), rc = ch.getBoundingClientRect(), k = rs.width / vb.width;
  tip.innerHTML = h.dataset.tip; tip.style.left = `${rs.left - rc.left + Number(h.dataset.x) * k}px`; tip.style.top = `${rs.top - rc.top + Number(h.dataset.y) * k}px`; tip.classList.add('on');
  $$('.bar', ch).forEach(b => b.classList.remove('hl')); h.nextElementSibling?.classList.add('hl');
});
document.addEventListener('pointerout', ev => { const ch = ev.target.closest('.chart'); if (ch && !ch.contains(ev.relatedTarget)) { ch.querySelector('.tip')?.classList.remove('on'); $$('.bar', ch).forEach(b => b.classList.remove('hl')); } });

// diálogos
document.addEventListener('DOMContentLoaded', () => {
  const dr = $('#drawer'), md = $('#modal');
  dr.addEventListener('click', ev => { if (ev.target === dr) closeDrawer(); });
  dr.addEventListener('close', () => { if (D && !D.sending) D = null; });
  md.addEventListener('click', ev => { if (ev.target === md) { closeModal(); if (confirmResolve) { const r = confirmResolve; confirmResolve = null; r(false); } } });
  md.addEventListener('close', () => { if (confirmResolve) { const r = confirmResolve; confirmResolve = null; r(false); } if (E && UI.route === 'editor' && $('#ed-items')) reItems(); });
  window.addEventListener('hashchange', onHash);
  window.addEventListener('beforeunload', ev => { if (E && E.dirty) { ev.preventDefault(); ev.returnValue = ''; } });
  render();
  initData();
});
