    }
  } else e.push('Elige la modalidad de traslado: privado o público.');
  if (!(doc.items || []).length) e.push('Agrega los bienes que se trasladan.');
  (doc.items || []).forEach((it, i) => {
    if (!String(it.desc || '').trim()) e.push(`El bien ${i + 1} no tiene descripción.`);
    if (!(Number(it.cant) > 0)) e.push(`La cantidad del bien ${i + 1} debe ser mayor a cero.`);
    if (esServicio(it)) e.push(`La línea ${i + 1} es un servicio (${UNIDADES[it.unidad]}): en una guía solo van bienes que se trasladan.`);
  });
  if (doc.fecha > todayISO()) e.push('La fecha de emisión no puede ser futura.');
  return e;
}

/* ---------- XML UBL 2.1 (estructura SUNAT, sin firma) ---------- */
function buildXML(doc, cfg) {
  if (doc.tipo === '09') return buildGRE(doc, cfg);
  const c = calc(doc), e = cfg.empresa, cli = doc.cliente || {};
  const cur = doc.moneda || 'PEN', A = `currencyID="${cur}"`;
  const isNC = doc.tipo === '07', isND = doc.tipo === '08', isNota = isNC || isND;
  const root = isNC ? 'CreditNote' : isND ? 'DebitNote' : 'Invoice';
  const sp = spot(doc, cfg.tipoCambio);
  const X = s => esc(s);
  const cd = s => `<![CDATA[${String(s ?? '').replace(/]]>/g, ']]]]><![CDATA[>')}]]>`;
  const id = docIdSunat(doc);
  const L = [];
  L.push('<?xml version="1.0" encoding="UTF-8"?>');
  L.push(`<${root} xmlns="urn:oasis:names:specification:ubl:schema:xsd:${root}-2" xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2" xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2" xmlns:ds="http://www.w3.org/2000/09/xmldsig#" xmlns:ext="urn:oasis:names:specification:ubl:schema:xsd:CommonExtensionComponents-2">`);
  L.push('  <ext:UBLExtensions><ext:UBLExtension><ext:ExtensionContent><!-- Aquí va la firma XMLDSig (certificado digital) que agrega tu backend --></ext:ExtensionContent></ext:UBLExtension></ext:UBLExtensions>');
  L.push('  <cbc:UBLVersionID>2.1</cbc:UBLVersionID>', '  <cbc:CustomizationID>2.0</cbc:CustomizationID>');
  L.push(`  <cbc:ID>${X(id)}</cbc:ID>`, `  <cbc:IssueDate>${doc.fecha}</cbc:IssueDate>`, `  <cbc:IssueTime>${doc.hora || '00:00:00'}</cbc:IssueTime>`);
  if (!isNota) {
    if (doc.vence) L.push(`  <cbc:DueDate>${doc.vence}</cbc:DueDate>`);
    // catálogo 51: 0101 venta interna · 1001 operación sujeta a detracción
    L.push(`  <cbc:InvoiceTypeCode listID="${sp.aplica ? '1001' : '0101'}">${doc.tipo}</cbc:InvoiceTypeCode>`);
  }
  L.push(`  <cbc:Note languageLocaleID="1000">${cd(numeroALetras(c.total, cur))}</cbc:Note>`);
  if (sp.aplica) L.push(`  <cbc:Note languageLocaleID="2006">${cd('Operación sujeta a detracción')}</cbc:Note>`);
  L.push(`  <cbc:DocumentCurrencyCode>${cur}</cbc:DocumentCurrencyCode>`);
  if (isNota && doc.ref) {
    const refId = `${doc.ref.serie}-${Number(doc.ref.numero)}`;
    L.push('  <cac:DiscrepancyResponse>', `    <cbc:ReferenceID>${X(refId)}</cbc:ReferenceID>`, `    <cbc:ResponseCode>${X(doc.ref.motivo)}</cbc:ResponseCode>`, `    <cbc:Description>${cd(doc.ref.sustento)}</cbc:Description>`, '  </cac:DiscrepancyResponse>');
    L.push('  <cac:BillingReference><cac:InvoiceDocumentReference>', `    <cbc:ID>${X(refId)}</cbc:ID>`, `    <cbc:DocumentTypeCode>${X(doc.ref.tipo)}</cbc:DocumentTypeCode>`, '  </cac:InvoiceDocumentReference></cac:BillingReference>');
  }
  // guías de remisión que sustentan el traslado de los bienes facturados
  if (!isNota) (doc.guias || []).forEach(g => L.push(`  <cac:DespatchDocumentReference><cbc:ID>${X(guiaId(g))}</cbc:ID><cbc:DocumentTypeCode listAgencyName="PE:SUNAT" listName="Tipo de Documento" listURI="urn:pe:gob:sunat:cpe:see:gem:catalogos:catalogo01">09</cbc:DocumentTypeCode></cac:DespatchDocumentReference>`));
  L.push('  <cac:Signature>', `    <cbc:ID>${X(e.ruc)}</cbc:ID>`, `    <cac:SignatoryParty><cac:PartyIdentification><cbc:ID>${X(e.ruc)}</cbc:ID></cac:PartyIdentification><cac:PartyName><cbc:Name>${cd(e.razon)}</cbc:Name></cac:PartyName></cac:SignatoryParty>`, '    <cac:DigitalSignatureAttachment><cac:ExternalReference><cbc:URI>#SignatureSP</cbc:URI></cac:ExternalReference></cac:DigitalSignatureAttachment>', '  </cac:Signature>');
  L.push('  <cac:AccountingSupplierParty><cac:Party>', `    <cac:PartyIdentification><cbc:ID schemeID="6">${X(e.ruc)}</cbc:ID></cac:PartyIdentification>`, `    <cac:PartyName><cbc:Name>${cd(e.comercial || e.razon)}</cbc:Name></cac:PartyName>`, `    <cac:PartyLegalEntity><cbc:RegistrationName>${cd(e.razon)}</cbc:RegistrationName>`, `      <cac:RegistrationAddress><cbc:ID>${X(e.ubigeo)}</cbc:ID><cbc:AddressTypeCode>0000</cbc:AddressTypeCode><cbc:CityName>${cd(e.provincia)}</cbc:CityName><cbc:CountrySubentity>${cd(e.departamento)}</cbc:CountrySubentity><cbc:District>${cd(e.distrito)}</cbc:District><cac:AddressLine><cbc:Line>${cd(e.direccion)}</cbc:Line></cac:AddressLine><cac:Country><cbc:IdentificationCode>PE</cbc:IdentificationCode></cac:Country></cac:RegistrationAddress>`, '    </cac:PartyLegalEntity>', '  </cac:Party></cac:AccountingSupplierParty>');
  L.push('  <cac:AccountingCustomerParty><cac:Party>', `    <cac:PartyIdentification><cbc:ID schemeID="${X(cli.tipoDoc || '0')}">${X(cli.tipoDoc === '0' ? '-' : cli.numDoc)}</cbc:ID></cac:PartyIdentification>`, `    <cac:PartyLegalEntity><cbc:RegistrationName>${cd(cli.nombre)}</cbc:RegistrationName>${cli.direccion ? `<cac:RegistrationAddress><cac:AddressLine><cbc:Line>${cd(cli.direccion)}</cbc:Line></cac:AddressLine></cac:RegistrationAddress>` : ''}</cac:PartyLegalEntity>`, '  </cac:Party></cac:AccountingCustomerParty>');
  if (sp.aplica) {
    // SPOT: cuenta del Banco de la Nación + código (cat. 54), porcentaje y monto en soles
    L.push(`  <cac:PaymentMeans><cbc:ID>Detraccion</cbc:ID><cbc:PaymentMeansCode>001</cbc:PaymentMeansCode><cac:PayeeFinancialAccount><cbc:ID>${X(cfg.docs.detraccion)}</cbc:ID></cac:PayeeFinancialAccount></cac:PaymentMeans>`);
    L.push(`  <cac:PaymentTerms><cbc:ID>Detraccion</cbc:ID><cbc:PaymentMeansID>${X(sp.codigo)}</cbc:PaymentMeansID><cbc:PaymentPercent>${sp.porcentaje}</cbc:PaymentPercent><cbc:Amount currencyID="PEN">${sp.monto.toFixed(2)}</cbc:Amount></cac:PaymentTerms>`);
  }
  if (doc.tipo === '01') {
    if (doc.formaPago === 'Credito') {
      // con detracción, el crédito informa el neto pendiente de pago (total − detracción)
      L.push(`  <cac:PaymentTerms><cbc:ID>FormaPago</cbc:ID><cbc:PaymentMeansID>Credito</cbc:PaymentMeansID><cbc:Amount ${A}>${(sp.aplica ? sp.neto : c.total).toFixed(2)}</cbc:Amount></cac:PaymentTerms>`);
      (doc.cuotas || []).forEach((q, i) => L.push(`  <cac:PaymentTerms><cbc:ID>FormaPago</cbc:ID><cbc:PaymentMeansID>Cuota${pad(i + 1, 3)}</cbc:PaymentMeansID><cbc:Amount ${A}>${Number(q.monto).toFixed(2)}</cbc:Amount><cbc:PaymentDueDate>${q.fecha}</cbc:PaymentDueDate></cac:PaymentTerms>`));
    } else L.push('  <cac:PaymentTerms><cbc:ID>FormaPago</cbc:ID><cbc:PaymentMeansID>Contado</cbc:PaymentMeansID></cac:PaymentTerms>');
  }
  const sub = (base, tax, code, name, type) => `    <cac:TaxSubtotal><cbc:TaxableAmount ${A}>${base.toFixed(2)}</cbc:TaxableAmount><cbc:TaxAmount ${A}>${tax.toFixed(2)}</cbc:TaxAmount><cac:TaxCategory><cac:TaxScheme><cbc:ID>${code}</cbc:ID><cbc:Name>${name}</cbc:Name><cbc:TaxTypeCode>${type}</cbc:TaxTypeCode></cac:TaxScheme></cac:TaxCategory></cac:TaxSubtotal>`;
  L.push('  <cac:TaxTotal>', `    <cbc:TaxAmount ${A}>${c.igv.toFixed(2)}</cbc:TaxAmount>`);
  if (c.gravada || (!c.exonerada && !c.inafecta)) L.push(sub(c.gravada, c.igv, '1000', 'IGV', 'VAT'));
  if (c.exonerada) L.push(sub(c.exonerada, 0, '9997', 'EXO', 'VAT'));
  if (c.inafecta) L.push(sub(c.inafecta, 0, '9998', 'INA', 'FRE'));
  L.push('  </cac:TaxTotal>');
  const mt = isND ? 'RequestedMonetaryTotal' : 'LegalMonetaryTotal';
  L.push(`  <cac:${mt}>`, `    <cbc:LineExtensionAmount ${A}>${r2(c.gravada + c.exonerada + c.inafecta).toFixed(2)}</cbc:LineExtensionAmount>`, `    <cbc:TaxInclusiveAmount ${A}>${c.total.toFixed(2)}</cbc:TaxInclusiveAmount>`, `    <cbc:PayableAmount ${A}>${c.total.toFixed(2)}</cbc:PayableAmount>`, `  </cac:${mt}>`);
  const lineTag = isNC ? 'CreditNoteLine' : isND ? 'DebitNoteLine' : 'InvoiceLine', qtyTag = isNC ? 'CreditedQuantity' : isND ? 'DebitedQuantity' : 'InvoicedQuantity';
  c.lines.forEach((l, i) => {
    const af = l.afect || '10';
    const scheme = af === '10' ? ['1000', 'IGV', 'VAT'] : af === '20' ? ['9997', 'EXO', 'VAT'] : ['9998', 'INA', 'FRE'];
    L.push(`  <cac:${lineTag}>`, `    <cbc:ID>${i + 1}</cbc:ID>`, `    <cbc:${qtyTag} unitCode="${X(l.unidad || 'NIU')}">${decStr(l.q, 0, 10).replace(/\.$/, '')}</cbc:${qtyTag}>`, `    <cbc:LineExtensionAmount ${A}>${l.valor.toFixed(2)}</cbc:LineExtensionAmount>`, `    <cac:PricingReference><cac:AlternativeConditionPrice><cbc:PriceAmount ${A}>${decStr(l.pu, 2, 6)}</cbc:PriceAmount><cbc:PriceTypeCode>01</cbc:PriceTypeCode></cac:AlternativeConditionPrice></cac:PricingReference>`);
    L.push('    <cac:TaxTotal>', `      <cbc:TaxAmount ${A}>${l.igv.toFixed(2)}</cbc:TaxAmount>`, `      <cac:TaxSubtotal><cbc:TaxableAmount ${A}>${l.valor.toFixed(2)}</cbc:TaxableAmount><cbc:TaxAmount ${A}>${l.igv.toFixed(2)}</cbc:TaxAmount><cac:TaxCategory><cbc:Percent>${af === '10' ? r2(c.rate * 100) : 0}</cbc:Percent><cbc:TaxExemptionReasonCode>${af}</cbc:TaxExemptionReasonCode><cac:TaxScheme><cbc:ID>${scheme[0]}</cbc:ID><cbc:Name>${scheme[1]}</cbc:Name><cbc:TaxTypeCode>${scheme[2]}</cbc:TaxTypeCode></cac:TaxScheme></cac:TaxCategory></cac:TaxSubtotal>`, '    </cac:TaxTotal>');
    L.push(`    <cac:Item><cbc:Description>${cd(l.desc)}</cbc:Description>${l.codigo ? `<cac:SellersItemIdentification><cbc:ID>${X(l.codigo)}</cbc:ID></cac:SellersItemIdentification>` : ''}</cac:Item>`, `    <cac:Price><cbc:PriceAmount ${A}>${decStr(l.vu, 2, 6)}</cbc:PriceAmount></cac:Price>`, `  </cac:${lineTag}>`);
  });
  L.push(`</${root}>`);
  return L.join('\n');
}

  L.push('  <ext:UBLExtensions><ext:UBLExtension><ext:ExtensionContent><!-- Aquí va la firma XMLDSig (certificado digital) que agrega tu backend --></ext:ExtensionContent></ext:UBLExtension></ext:UBLExtensions>');
  L.push('  <cbc:UBLVersionID>2.1</cbc:UBLVersionID>', '  <cbc:CustomizationID>2.0</cbc:CustomizationID>');

  L.push(`  <cbc:DespatchAdviceTypeCode ${C('01')} listName="Tipo de Documento">09</cbc:DespatchAdviceTypeCode>`);

  }
  L.push('  <cac:Signature>', `    <cbc:ID>${X(e.ruc)}</cbc:ID>`, `    <cac:SignatoryParty><cac:PartyIdentification><cbc:ID>${X(e.ruc)}</cbc:ID></cac:PartyIdentification><cac:PartyName><cbc:Name>${cd(e.razon)}</cbc:Name></cac:PartyName></cac:SignatoryParty>`, '    <cac:DigitalSignatureAttachment><cac:ExternalReference><cbc:URI>#SignatureSP</cbc:URI></cac:ExternalReference></cac:DigitalSignatureAttachment>', '  </cac:Signature>');
  L.push(`  <cac:DespatchSupplierParty><cac:Party><cac:PartyIdentification><cbc:ID schemeID="6" ${ID6}>${X(e.ruc)}</cbc:ID></cac:PartyIdentification><cac:PartyLegalEntity><cbc:RegistrationName>${cd(e.razon)}</cbc:RegistrationName></cac:PartyLegalEntity></cac:Party></cac:DespatchSupplierParty>`);
  L.push(`  <cac:DeliveryCustomerParty><cac:Party><cac:PartyIdentification><cbc:ID schemeID="${X(cli.tipoDoc)}" ${ID6}>${X(cli.numDoc)}</cbc:ID></cac:PartyIdentification><cac:PartyLegalEntity><cbc:RegistrationName>${cd(cli.nombre)}</cbc:RegistrationName></cac:PartyLegalEntity></cac:Party></cac:DeliveryCustomerParty>`);
  L.push('  <cac:Shipment>', '    <cbc:ID>SUNAT_Envio</cbc:ID>');
  L.push(`    <cbc:HandlingCode ${C('20')} listName="Motivo de traslado">${X(t.motivo)}</cbc:HandlingCode>`);
  L.push(`    <cbc:HandlingInstructions>${cd(t.motivo === '13' ? t.descMotivo : MOTIVOS_TRASLADO[t.motivo])}</cbc:HandlingInstructions>`);
  L.push(`    <cbc:GrossWeightMeasure unitCode="KGM">${Number(t.pesoKg || 0).toFixed(3)}</cbc:GrossWeightMeasure>`);
  if (Number(t.bultos) > 0) L.push(`    <cbc:TotalTransportHandlingUnitQuantity>${Math.round(Number(t.bultos))}</cbc:TotalTransportHandlingUnitQuantity>`);
  if (t.modalidad === '02' && t.m1l) L.push('    <cbc:SpecialInstructions>SUNAT_Envio_IndicadorTrasladoVehiculoM1L</cbc:SpecialInstructions>');
  L.push('    <cac:ShipmentStage>', `      <cbc:TransportModeCode listName="Modalidad de traslado" ${C('18')}>${X(t.modalidad)}</cbc:TransportModeCode>`, `      <cac:TransitPeriod><cbc:StartDate>${X(t.fechaInicio)}</cbc:StartDate></cac:TransitPeriod>`);
  if (t.modalidad === '01') {
    const tr = t.transportista || {};
    L.push(`      <cac:CarrierParty><cac:PartyIdentification><cbc:ID schemeID="6">${X(tr.ruc)}</cbc:ID></cac:PartyIdentification><cac:PartyLegalEntity><cbc:RegistrationName>${cd(tr.razon)}</cbc:RegistrationName>${tr.mtc ? `<cbc:CompanyID>${X(tr.mtc)}</cbc:CompanyID>` : ''}</cac:PartyLegalEntity></cac:CarrierParty>`);
  } else if (!t.m1l) {

    L.push(`      <cac:DriverPerson><cbc:ID schemeID="1" ${ID6}>${X(ch.numDoc)}</cbc:ID><cbc:FirstName>${cd(ch.nombres)}</cbc:FirstName><cbc:FamilyName>${cd(ch.apellidos)}</cbc:FamilyName><cbc:JobTitle>Principal</cbc:JobTitle><cac:IdentityDocumentReference><cbc:ID>${X(String(ch.licencia || '').toUpperCase())}</cbc:ID></cac:IdentityDocumentReference></cac:DriverPerson>`);
  }
  L.push('    </cac:ShipmentStage>');
  const P = t.partida || {}, Ll = t.llegada || {};
  L.push('    <cac:Delivery>', `      <cac:DeliveryAddress><cbc:ID schemeAgencyName="PE:INEI" schemeName="Ubigeos">${X(Ll.ubigeo)}</cbc:ID><cac:AddressLine><cbc:Line>${cd(Ll.direccion)}</cbc:Line></cac:AddressLine></cac:DeliveryAddress>`, `      <cac:Despatch><cac:DespatchAddress><cbc:ID schemeAgencyName="PE:INEI" schemeName="Ubigeos">${X(P.ubigeo)}</cbc:ID><cac:AddressLine><cbc:Line>${cd(P.direccion)}</cbc:Line></cac:AddressLine></cac:DespatchAddress></cac:Despatch>`, '    </cac:Delivery>');
  if (t.modalidad === '02' && !t.m1l && t.placa) L.push(`    <cac:TransportHandlingUnit><cac:TransportEquipment><cbc:ID>${X(normPlaca(t.placa))}</cbc:ID></cac:TransportEquipment></cac:TransportHandlingUnit>`);
  L.push('  </cac:Shipment>');
  (doc.items || []).forEach((it, i) => {
    L.push('  <cac:DespatchLine>', `    <cbc:ID>${i + 1}</cbc:ID>`, `    <cbc:DeliveredQuantity unitCode="${X(it.unidad || 'NIU')}">${decStr(Number(it.cant) || 0, 0, 10).replace(/\.$/, '')}</cbc:DeliveredQuantity>`, `    <cac:OrderLineReference><cbc:LineID>${i + 1}</cbc:LineID></cac:OrderLineReference>`, `    <cac:Item><cbc:Description>${cd(it.desc)}</cbc:Description><cac:SellersItemIdentification><cbc:ID>${X(it.codigo || `ITEM${i + 1}`)}</cbc:ID></cac:SellersItemIdentification></cac:Item>`, '  </cac:DespatchLine>');
  });
  L.push('</DespatchAdvice>');
  return L.join('\n');
}

/* Texto del QR de la representación impresa */
const qrText = (d, cfg, c) => [cfg.empresa.ruc, d.tipo, d.serie, d.numero, c.igv.toFixed(2), c.total.toFixed(2), fmtDate(d.fecha), d.cliente?.tipoDoc || '0', d.cliente?.tipoDoc === '0' ? '-' : d.cliente?.numDoc || '-', d.sunat?.hash || ''].join('|') + '|';

async function sha256b64(text) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    let s = ''; new Uint8Array(buf).forEach(b => (s += String.fromCharCode(b)));
    return btoa(s).slice(0, 28);
  } catch { return uid().slice(0, 28); }
}

function niceMax(v) { if (v <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

/* ================= CLIENTES ================= */
function vClientes() {
  const q = UI.cliQ.trim().toLowerCase();
  const stats = new Map();
  cpes().filter(d => d.estado === 'aceptado').forEach(d => { const k = d.cliente?.numDoc || d.cliente?.nombre; const s = stats.get(k) || { n: 0, v: 0 }; s.n += d.tipo === '07' ? 0 : 1; s.v += signedTotal(d); stats.set(k, s); });
  const list = [...DB.cols.clientes.values()].sort((a, b) => a.nombre.localeCompare(b.nombre)).filter(c => !q || c.nombre.toLowerCase().includes(q) || (c.numDoc || '').includes(q));
  return `
  <div class="page-head"><div><h1>Clientes</h1><p class="sub">${DB.cols.clientes.size} registrados · se autocompletan al cotizar y facturar.</p></div>

const API_CONTRACT = `POST {API}/cpe/emitir
{
  "ambiente": "beta",
  "emisor":   { "ruc": "20…", "razonSocial": "…" },
  "documento": { "tipo": "01", "serie": "F001", "numero": 16,

                 "formaPago": "Contado", "cuotas": [] },
  "xml": "<Invoice …> (UBL 2.1 sin firmar)"
}
→ 200 { "estado": "ACEPTADO" | "OBSERVADO" | "RECHAZADO" | "ERROR",
        "codigo": "0",
        "descripcion": "La Factura numero F001-16, ha sido aceptada",
        "hash": "…", "observaciones": [],
        "cdrZipBase64": "…" }

GET  {API}/padron/ruc/{ruc}
→ 200 { "ruc", "razonSocial", "direccion", "estado", "condicion" }

GET  {API}/health  → 200`;
function archSVG() {
  const box = (x, y, w, h, fill, stroke, t1, t2, dark) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/><text x="${x + w / 2}" y="${y + h / 2 - (t2 ? 3 : -4)}" text-anchor="middle" font-size="12.5" font-weight="650" fill="${dark ? '#fff' : '#1A1517'}">${t1}</text>${t2 ? `<text x="${x + w / 2}" y="${y + h / 2 + 13}" text-anchor="middle" font-size="10.5" fill="${dark ? '#D9CFD1' : '#5F5559'}">${t2}</text>` : ''}`;
  const arrow = (x1, y1, x2, y2, label, lx, anchor = 'start') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#0F3B4C" stroke-width="1.6" marker-end="url(#ah)"/>${label ? `<text x="${lx}" y="${(y1 + y2) / 2 + 4}" font-size="10.5" fill="#574D51" text-anchor="${anchor}">${label}</text>` : ''}`;
  return `<svg viewBox="0 0 340 352" font-family="Geist, system-ui, sans-serif" role="img" aria-label="Flujo: la web envía el documento a tu API, que firma y envía a SUNAT, y SUNAT devuelve la constancia CDR">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F3B4C"/></marker></defs>
    ${box(40, 6, 260, 52, '#141113', '#141113', 'AI Toque (web · tablet)', 'Cotiza, valida y arma el XML UBL 2.1', true)}
    ${arrow(140, 60, 140, 112, 'JSON + XML', 132, 'end')}
    ${arrow(200, 112, 200, 60, 'Estado + CDR', 208)}
    ${box(40, 114, 260, 64, '#EEF7F8', '#7FCFD3', 'Tu API (p. ej. Azure Functions)', 'Firma con certificado digital · ZIP', false)}
    <text x="170" y="170" text-anchor="middle" font-size="10.5" fill="#5F5559">Clave SOL y certificado viven aquí</text>

async function processLogo(file) {
  if (!file) return;
  if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)) { toast('Sube una imagen PNG, JPG, WebP o SVG.', 'bad'); return; }
  if (file.size > 8e6) { toast('La imagen pesa más de 8 MB. Prueba con una más liviana.', 'bad'); return; }
  const btn = $('#logo-btn'); btn?.classList.add('loading');
  try {
    const url = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(file); });
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const w0 = img.naturalWidth || 400, h0 = img.naturalHeight || 160, alpha = file.type !== 'image/jpeg';
    let out = null;
    for (const [mw, mh, fmt, q] of [[540, 200, alpha ? 'image/png' : 'image/jpeg', 0.9], [420, 160, alpha ? 'image/png' : 'image/jpeg', 0.85], [360, 140, 'image/jpeg', 0.82], [280, 110, 'image/jpeg', 0.75]]) {
      const k = Math.min(1, mw / w0, mh / h0), w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d');
      if (fmt === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); }
      g.drawImage(img, 0, 0, w, h);
      const data = cv.toDataURL(fmt, q);
      out = { dataUrl: data, w, h };
      if (data.length < 180000) break;
    }
    if (!out || out.dataUrl.length > 240000) { toast('No pudimos reducir el logo lo suficiente. Prueba con otra imagen.', 'bad'); return; }
    await saveLogo(out); toast('Logo actualizado');
    render();
  } catch { toast('No se pudo leer la imagen.', 'bad'); }
  finally { $('#logo-btn')?.classList.remove('loading'); }
}

/* ================= TOASTS ================= */
function toast(msg, kind = 'ok', action) {
  const box = $('#toasts'); const el = document.createElement('div');
  el.className = `toast ${kind === 'ok' ? '' : kind}`; el.setAttribute('role', kind === 'bad' ? 'alert' : 'status');
  el.innerHTML = `${icon(kind === 'ok' ? 'check' : 'alert')}<span>${esc(msg)}</span>${action ? `<button class="t-act">${esc(action.label)}</button>` : ''}`;
  if (action) el.querySelector('.t-act').onclick = () => { action.fn(); dismiss(); };
  box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  try { if (box.showPopover) { if (box.matches(':popover-open')) box.hidePopover(); box.showPopover(); } } catch { /* sin popover: queda bajo los diálogos */ }
  let tm = setTimeout(dismiss, kind === 'bad' ? 6000 : 3800);
  el.onmouseenter = () => clearTimeout(tm); el.onmouseleave = () => { tm = setTimeout(dismiss, 1800); };
  function dismiss() { el.classList.add('out'); setTimeout(() => el.remove(), 200); }
}

/* ---------- archivo de copias PDF ---------- */
const IDB = { db: null };
function idbOpen() {
  if (IDB.db) return Promise.resolve(IDB.db);
  return new Promise((ok, ko) => { try { const r = indexedDB.open('granate-archivo', 1); r.onupgradeneeded = () => r.result.createObjectStore('pdf'); r.onsuccess = () => { IDB.db = r.result; ok(IDB.db); }; r.onerror = () => ko(r.error); } catch (e) { ko(e); } });
}
async function idbPut(k, blob) { const db = await idbOpen(); return new Promise((ok, ko) => { const tx = db.transaction('pdf', 'readwrite'); tx.objectStore('pdf').put(blob, k); tx.oncomplete = () => ok(); tx.onerror = () => ko(tx.error); }); }
async function idbGet(k) { const db = await idbOpen(); return new Promise((ok, ko) => { const tx = db.transaction('pdf', 'readonly'); const r = tx.objectStore('pdf').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
const blobB64 = blob => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ko; r.readAsDataURL(blob); });

const ARCH_Q = new Set();
async function archivePDF(doc, nota = '') {
  if (DB.cfg.reglas?.archivarPDF === false || !doc?.numero) return;
  const key = `${doc.id}:${doc.estado}:${doc.version || 0}:${nota}`; if (ARCH_Q.has(key)) return; ARCH_Q.add(key);
  try {
    await sleep(300);
    const fresh = getDoc(doc.id) || doc;
    const blob = await makePDF(fresh);
    const version = archivoDe(fresh.id).length + 1;
    const nombre = `${fresh.tipo === 'COT' ? 'Cotizacion' : TIPOS[fresh.tipo].corto.replace(/\s/g, '')}-${docNum(fresh)}${version > 1 ? `-v${version}` : ''}.pdf`;
    const row = { id: uid(), ts: new Date().toISOString(), docId: fresh.id, tipo: fresh.tipo, docNum: docNum(fresh), cliente: fresh.cliente?.nombre || '', total: fresh.tipo === '09' ? 0 : totalOf(fresh), moneda: fresh.moneda || 'PEN', estado: fresh.estado, version, nota, nombre, bytes: blob.size, donde: '', ref: '', url: '', usuario: DB.uid || '' };
    const base = apiBase();
    if (DB.mode === 'nube') {
      const j = await nubeFetch('/archivos', { method: 'POST', body: { nombre, tipo: 'application/pdf', base64: await blobB64(blob) }, timeout: 60000 });
      row.donde = 'nube'; row.ref = j.ref;
    } else if (base) {
      const r = await fetch(`${base}/archivo`, { method: 'POST', headers: apiHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ ruc: DB.cfg.empresa.ruc, docId: fresh.id, tipo: fresh.tipo, serie: fresh.serie, numero: fresh.numero, version, nombre, nota, pdfBase64: await blobB64(blob), documento: apiDoc(fresh) }) });
      if (!r.ok) throw new Error('api'); const j = await r.json(); row.donde = 'api'; row.ref = String(j.id);
    } else if (DB.assets) {
      const a = await DB.assets.upload(new File([blob], nombre, { type: 'application/pdf' })); row.donde = 'assets'; row.ref = a.id; row.url = a.url;
    } else { await idbPut(row.id, blob); row.donde = 'local'; row.ref = row.id; }

  } catch (e) { console.warn('archivo', e); ARCH_Q.delete(key); }
}

    const faltan = []; for (let n = 1; n <= max && faltan.length < 30; n++) if (!set.has(n)) faltan.push(n);

async function hydrateUsers() {
  const els = $$('[data-uid]'); if (!els.length || !DB.user) return;
  try { const ids = [...new Set(els.map(e => e.dataset.uid))]; const ps = await DB.user.profiles(ids); els.forEach(e => { e.textContent = ps[e.dataset.uid]?.name || 'Usuario'; }); } catch { /* sin nombres */ }
}
function csvHistorial() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['fecha', 'hora', 'movimiento', 'tipo_doc', 'documento', 'cliente', 'importe', 'moneda', 'estado', 'detalle']].concat(movsFiltrados().map(m => [tsDay(m.ts), tsHora(m.ts), EVENTOS[m.evento]?.[0] || m.evento, TIPOS[m.tipo]?.corto || '', m.docNum, m.cliente, m.monto || '', m.moneda, m.estado, m.detalle]));

/* ---------- envío de la guía a tu API (producción) ---------- */
const apiDoc = d => { const o = clone(d); delete o.sunat; return o; };
async function viaApiGRE(doc, step) {
  const cfg = DB.cfg, base = String(cfg.integracion.url || '').trim().replace(/\/+$/, '');
  if (cfg.integracion.ambiente !== 'produccion') {   // SUNAT no publica ambiente de pruebas para GRE
    const r = await viaSimulador(doc, step);
    return { ...r, descripcion: `${r.descripcion} · simulador: SUNAT no tiene ambiente beta para guías`, modo: 'simulador' };
  }
  if (!/^https?:\/\//.test(base)) throw new Error('Configura la URL de tu API en «Integración SUNAT».');
  step('xml', 'run'); const xml = buildXML(doc, cfg); step('xml', 'done'); step('firma', 'run'); step('envio', 'run');
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
  let r; try { r = await fetch(`${base}/gre/emitir`, { method: 'POST', headers: apiHeaders({ 'Content-Type': 'application/json' }), signal: ctl.signal, body: JSON.stringify({ ambiente: 'produccion', emisor: { ruc: cfg.empresa.ruc, razonSocial: cfg.empresa.razon }, documento: apiDoc(doc), xml }) }); }
  catch (e) { clearTimeout(to); step('firma', 'fail'); throw new Error(e.name === 'AbortError' ? 'Tu API no respondió a tiempo. La guía pudo llegar: consulta el ticket antes de reenviar.' : 'No se pudo conectar con tu API.'); }
  clearTimeout(to);
  let j = {}; try { j = await r.json(); } catch { /* */ }
  if (!r.ok) { step('firma', 'fail'); throw new Error(j.mensaje || `Tu API respondió ${r.status}.`); }
  step('firma', 'done'); step('envio', 'done');
  const est = String(j.estado || '').toLowerCase();
  if (est === 'en_proceso') { step('cdr', 'run'); return { estado: 'pendiente', error: `SUNAT recibió la guía (ticket ${j.ticket}) y aún la procesa. Vuelve a consultar en unos segundos.` }; }
  const map = { aceptado: 'aceptado', observado: 'observado', rechazado: 'rechazado' };
  step('cdr', map[est] === 'rechazado' ? 'fail' : 'done');
  return { estado: map[est] || 'pendiente', codigo: String(j.codigo ?? ''), descripcion: j.descripcion || '', hash: j.hash || '', observaciones: j.observaciones || [], cdr: j.cdrZipBase64 && j.cdrZipBase64.length < 150000 ? j.cdrZipBase64 : '', modo: 'api', ambiente: 'produccion', error: map[est] ? undefined : (j.mensaje || 'Respuesta sin estado reconocible.') };
}

}

<!-- CONSTANCIA SIMULADA por Granate (modo simulador): NO tiene validez tributaria. En beta o producción SUNAT devuelve este archivo firmado. -->

async function cdrDe(d) {

async function verPDF(d) {

/* ================= FACTURACIÓN RÁPIDA: COTIZACIÓN → FACTURA → GUÍA ================= */
const cotsFacturables = () => cots().filter(d => !['facturada', 'rechazada'].includes(d.estado) && d.numero && (d.items || []).length)
  .sort((a, b) => (b.estado === 'aprobada') - (a.estado === 'aprobada') || byRecent(a, b));

  setTimeout(() => { if (matchMedia('(pointer:fine)').matches) $('#cot-q')?.focus(); }, 50);

function cotList() {
  const q = (UI.cotQ || '').toLowerCase();

  if (!list.length) return emptyHTML('quote', 'Sin cotizaciones por facturar', 'Las cotizaciones facturadas o rechazadas no aparecen aquí.');
  return list.map(d => `<button class="pick" data-act="cot-usar" data-id="${d.id}"><span><b class="num">${docNum(d)}</b><small>${esc(d.cliente?.nombre || '')} · ${fmtDate(d.fecha)} · ${d.items.length} ítem${d.items.length > 1 ? 's' : ''}</small></span>${docPill(d)}<span class="num">${money(totalOf(d), d.moneda)}</span><span class="qty" style="background:var(--granate-50);color:var(--granate)">${icon('arrow', 'sm')}</span></button>`).join('');
}
/* La guía puede emitirse antes (vinculada en la factura) o después (desde la factura emitida). Mientras falte, queda pendiente. */
function guiaPendiente(d) {
  if (!d || !['01', '03'].includes(d.tipo) || d.operacion !== 'bienes' || (d.guias || []).length) return false;
  if (!['pendiente', 'aceptado', 'observado'].includes(d.estado)) return false;
  if (!(d.guiaPosterior || d.tipo === '01' || DB.cfg.reglas?.guiaBoleta)) return false;
  return !gres().some(g => (g.deFacturaId === d.id || g.facturaId === d.id) && !['borrador', 'rechazado'].includes(g.estado));
}
const ultimoTransporte = () => gres().filter(g => g.numero && g.traslado && g.estado !== 'rechazado').sort(byRecent)[0]?.traslado || null;
function startGuiaDeFactura(fid) {
  const f = getDoc(fid); if (!f) return;
  const borr = gres().find(g => g.deFacturaId === f.id && g.estado === 'borrador'); if (borr) return startEdit(borr.id);
  const ya = gres().find(g => (g.deFacturaId === f.id || g.facturaId === f.id) && !['borrador', 'rechazado'].includes(g.estado));
  if (ya) { toast(`${docNum(f)} ya tiene la guía ${docNum(ya)}.`); return openDrawer(ya.id); }
  const items = (f.items || []).filter(it => !esServicio(it)).map(it => ({ id: uid(), codigo: it.codigo, desc: it.desc, unidad: it.unidad, cant: it.cant }));
  if (!items.length) { toast('Este comprobante no tiene bienes que trasladar.', 'warn'); return; }
  const g = newDoc('09', { cliente: clone(f.cliente), items, docRel: { tipo: f.tipo, serie: f.serie, numero: f.numero }, facturaId: f.id, deFacturaId: f.id, obs: '' });
  const prev = ultimoTransporte();

/* ---------- botones flotantes que se pueden mover (WhatsApp y LanAI) ----------
   Se arrastran con el dedo o el mouse; al soltarlos se pegan al borde más cercano y la posición
   queda guardada en este equipo. Un toque sin arrastrar funciona como clic normal. */
const FAB_POS = 'granate.fab.';
function posFab(el, clave) {
  let p = null; try { p = JSON.parse(localStorage.getItem(FAB_POS + clave) || 'null'); } catch { /* sin almacenamiento */ }
  if (!p) { Object.assign(el.style, { left: '', top: '', right: '', bottom: '' }); el.classList.remove('movido'); return; }
  const r = el.getBoundingClientRect(), m = 10, vw = innerWidth, vh = innerHeight;
  const x = p.lado === 'izq' ? m : vw - r.width - m, y = Math.min(Math.max(m, p.ry * (vh - r.height)), vh - r.height - m);
  Object.assign(el.style, { left: `${x}px`, top: `${y}px`, right: 'auto', bottom: 'auto' }); el.classList.add('movido');
}
function hacerArrastrable(el, clave) {
  if (el._arrastrable) return; el._arrastrable = true;
  let ini = null, mov = false;
  el.addEventListener('pointerdown', ev => { if (ev.button !== 0) return; const r = el.getBoundingClientRect(); ini = { x: ev.clientX, y: ev.clientY, l: r.left, t: r.top, w: r.width, h: r.height, id: ev.pointerId }; mov = false; try { el.setPointerCapture(ev.pointerId); } catch { /* */ } });
  el.addEventListener('pointermove', ev => {
    if (!ini || ev.pointerId !== ini.id) return;
    const dx = ev.clientX - ini.x, dy = ev.clientY - ini.y;
    if (!mov && Math.hypot(dx, dy) < 8) return;
    if (!mov) { mov = true; el.classList.add('arrastrando'); }
    ev.preventDefault();
    const x = Math.min(Math.max(4, ini.l + dx), innerWidth - ini.w - 4), y = Math.min(Math.max(4, ini.t + dy), innerHeight - ini.h - 4);
    Object.assign(el.style, { left: `${x}px`, top: `${y}px`, right: 'auto', bottom: 'auto' });
  });
  const fin = () => {
    if (!ini) return; const movido = mov; ini = null; mov = false;
    if (!movido) return;
    el.classList.remove('arrastrando');
    const r = el.getBoundingClientRect();
    const pos = { lado: r.left + r.width / 2 < innerWidth / 2 ? 'izq' : 'der', ry: Math.min(1, Math.max(0, r.top / Math.max(1, innerHeight - r.height))) };
    try { localStorage.setItem(FAB_POS + clave, JSON.stringify(pos)); } catch { /* */ }
    posFab(el, clave); el._sinClick = Date.now();
  };
  el.addEventListener('pointerup', fin); el.addEventListener('pointercancel', fin);
  el.addEventListener('click', ev => { if (el._sinClick && Date.now() - el._sinClick < 450) { ev.preventDefault(); ev.stopImmediatePropagation(); } }, true);
  el.addEventListener('dragstart', ev => ev.preventDefault());
  addEventListener('resize', () => posFab(el, clave));
  posFab(el, clave);
}

/* =====================================================================
   Granate · modo nube (Azure Functions + Cosmos DB)
   Sesión por usuario, copia local para trabajar sin señal, sincronización
   cada 20 s y numeración reservada en el servidor (sin números repetidos).
   ===================================================================== */
const NUBE_SES = 'granate.nube.sesion';
const NUBE = { sesion: null, desde: 0, pend: new Map(), timer: null, sincronizando: false, subiendo: false, offline: false, ultima: 0, error: '', vista: 'ingresar', usuarios: null, cargandoUsr: false, cfgNube: false, primera: true, cacheT: null, subirT: null, oyentes: false };
const ROL_TXT = { admin: 'Administrador', contador: 'Contador', vendedor: 'Vendedor' };
const ROL_DESC = { admin: 'Todo, incluida la configuración y los usuarios', contador: 'Todo, incluida la configuración; no gestiona usuarios', vendedor: 'Cotiza, factura y registra clientes y productos; no cambia la configuración' };
function nubeURL() {
  if (typeof GRANATE_PRUEBA !== 'undefined' && GRANATE_PRUEBA) return '';
  if (window.claude && typeof window.claude.use === 'function') return '';
  const u = String(window.GRANATE_NUBE || '').trim().replace(/\/+$/, '');
  return /^https:\/\/|^http:\/\/localhost/.test(u) ? u : '';
}
const nubeRol = () => NUBE.sesion?.usuario?.rol || '';
const puedeConfig = () => DB.mode !== 'nube' || ['admin', 'contador'].includes(nubeRol());
const hhmm = ms => { const d = new Date(ms); return `${pad(d.getHours(), 2)}:${pad(d.getMinutes(), 2)}`; };
const iniciales = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();

/* ---------- sesión ---------- */
function leerSesion() { try { const s = JSON.parse(localStorage.getItem(NUBE_SES) || 'null'); return s && s.token && s.url === nubeURL() ? s : null; } catch { return null; } }
function guardarSesion(s) { NUBE.sesion = s ? { ...s, url: nubeURL() } : null; try { if (s) localStorage.setItem(NUBE_SES, JSON.stringify(NUBE.sesion)); else localStorage.removeItem(NUBE_SES); } catch { /* sin almacenamiento */ } }
function sesionVencida(msg) {
  guardarSesion(null);
  try { sessionStorage.setItem('granate.nube.aviso', msg || 'Tu sesión venció. Vuelve a ingresar.'); } catch { /* */ }
  location.reload();
}

async function nubeFetch(path, { method = 'GET', body, raw = false, auth = true, timeout = 30000 } = {}) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), timeout);
  let r;
  try {
    r = await fetch(nubeURL() + path, { method, signal: ctl.signal, headers: { ...(body ? { 'Content-Type': 'application/json' } : {}), ...(auth && NUBE.sesion?.token ? { Authorization: `Bearer ${NUBE.sesion.token}` } : {}) }, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { const x = new Error(e.name === 'AbortError' ? 'La nube tardó demasiado en responder. Revisa tu conexión.' : 'Sin conexión con la nube. Revisa tu internet.'); x.red = true; throw x; }
  finally { clearTimeout(to); }
  if (raw && r.ok) return r.blob();
  let j = {}; try { j = await r.json(); } catch { /* sin cuerpo */ }
  if (!r.ok) {
    const x = new Error(j.mensaje || `La nube respondió ${r.status}.`); x.status = r.status;
    if (r.status === 401 && auth && NUBE.sesion) sesionVencida(x.message);
    throw x;
  }
  return j;
}

/* ---------- copia local (IndexedDB: cabe mucho más que localStorage) ---------- */
const NIDB = { db: null };
function nidb() { if (NIDB.db) return Promise.resolve(NIDB.db); return new Promise((ok, ko) => { try { const r = indexedDB.open('granate-nube', 1); r.onupgradeneeded = () => r.result.createObjectStore('cache'); r.onsuccess = () => { NIDB.db = r.result; ok(NIDB.db); }; r.onerror = () => ko(r.error); } catch (e) { ko(e); } }); }
async function cacheLeer(k) { try { const db = await nidb(); return await new Promise((ok, ko) => { const r = db.transaction('cache').objectStore('cache').get(k); r.onsuccess = () => ok(r.result || null); r.onerror = () => ko(r.error); }); } catch { return null; } }
async function cacheEscribir(k, v) { try { const db = await nidb(); await new Promise((ok, ko) => { const tx = db.transaction('cache', 'readwrite'); tx.objectStore('cache').put(v, k); tx.oncomplete = () => ok(); tx.onerror = () => ko(tx.error); }); } catch (e) { console.warn('copia local', e); } }
const cacheKey = () => `emp:${NUBE.sesion?.empresa?.ruc || ''}`;
function persistNube() {
  clearTimeout(NUBE.cacheT);
  NUBE.cacheT = setTimeout(() => {
    if (!NUBE.sesion) return;
    const cols = Object.fromEntries(Object.entries(DB.cols).map(([k, m]) => [k, k === 'movimientos' ? [...m.values()].sort((a, b) => (b.ts || '').localeCompare(a.ts || '')).slice(0, 5000) : [...m.values()]]));
    cacheEscribir(cacheKey(), { desde: NUBE.desde, cfg: clone(DB.cfg), cfgNube: NUBE.cfgNube, logo: DB.logo, cols, pend: [...NUBE.pend.values()] });
  }, 250);
}

/* ---------- arranque ---------- */
async function startNube() {
  DB.mode = 'nube';
  NUBE.sesion = leerSesion();
  if (!NUBE.sesion) { render(); return; }   // pantalla de ingreso
  await abrirSesionNube();
}
async function abrirSesionNube() {
  const c = await cacheLeer(cacheKey());
  for (const k of Object.keys(DB.cols)) DB.cols[k] = new Map((c?.cols?.[k] || []).map(o => [o.id, o]));
  DB.cfg = mergeCfg(c?.cfg || defaultConfig()); DB.logo = c?.logo || null;
  NUBE.cfgNube = !!c?.cfgNube; NUBE.desde = c?.desde || 0; NUBE.primera = true;
  NUBE.pend = new Map((c?.pend || []).map(p => [`${p.col}:${p.borrado ? p.id : p.obj?.id}`, p]));
  DB.uid = NUBE.sesion.usuario.email;
  document.body.classList.remove('sin-sesion');
  setReady();
  sincronizar(true);
  clearInterval(NUBE.timer); NUBE.timer = setInterval(() => sincronizar(), 20000);
  if (!NUBE.oyentes) {
    NUBE.oyentes = true;
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(); });
    window.addEventListener('online', () => { NUBE.offline = false; sincronizar(); });
    window.addEventListener('beforeunload', ev => { if (NUBE.pend.size && !NUBE.offline) { nubeSubir(); } });
  }
  const tok = NUBE.sesion.token;
  nubeFetch('/auth/yo').then(s => { if (NUBE.sesion?.token !== tok) return; guardarSesion(s); renderNav(); if (s.usuario.debeCambiar) claveModal(true); }).catch(() => { /* sin señal: se sigue con la copia local */ });
  if (NUBE.sesion.usuario.debeCambiar) setTimeout(() => { if (NUBE.sesion?.usuario?.debeCambiar) claveModal(true); }, 500);
}

/* ---------- sincronización ---------- */
const mismo = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function aplicarItems(items) {
  let n = 0;
  for (const it of items || []) {
    if (NUBE.pend.has(`${it.col}:${it.id}`)) continue;   // hay un cambio local más reciente por subir
    if (it.col === 'config') {
      if (it.id === 'empresa') { NUBE.cfgNube = true; if (it.borrado || !it.data) continue; const c = { ...it.data }; delete c.id; const m = mergeCfg(c); if (!mismo(m, DB.cfg)) { DB.cfg = m; n++; } }
      else if (it.id === 'logo') { const l = it.borrado || !it.data?.dataUrl ? null : { dataUrl: it.data.dataUrl, w: it.data.w, h: it.data.h }; if (!mismo(l, DB.logo)) { DB.logo = l; n++; } }
      continue;
    }
    const m = DB.cols[it.col]; if (!m) continue;
    if (it.borrado) { if (m.delete(it.id)) n++; }
    else if (!mismo(m.get(it.id), it.data)) { m.set(it.id, it.data); n++; }
  }
  return n;
}
async function sincronizar(primera = false) {
  if (!NUBE.sesion || NUBE.sincronizando) return;
  if (!primera && document.visibilityState === 'hidden') return;
  NUBE.sincronizando = true;
  try {
    await nubeSubir();
    let cont = null, hasta = NUBE.desde, n = 0, vueltas = 0;
    do {
      const j = await nubeFetch(`/datos?desde=${NUBE.desde}${cont ? `&cont=${encodeURIComponent(cont)}` : ''}`, { timeout: 45000 });
      n += aplicarItems(j.items); hasta = Math.max(hasta, j.hasta || 0); cont = j.cont; vueltas++;
    } while (cont && vueltas < 500);
    NUBE.desde = hasta; NUBE.ultima = Date.now(); NUBE.offline = false; NUBE.error = '';
    if (NUBE.primera) { NUBE.primera = false; configInicialNube(); }
    persistNube();
    if (n) changed();
  } catch (e) { if (e.red) NUBE.offline = true; else NUBE.error = e.message; }
  finally { NUBE.sincronizando = false; pintarEstadoNube(); }
}
function nubeEncolar(col, obj, borrado = false, id = '') {
  const it = borrado ? { col, id, borrado: true } : { col, obj: clone(obj) };
  NUBE.pend.set(`${col}:${borrado ? id : obj.id}`, it);
  persistNube(); pintarEstadoNube();
  clearTimeout(NUBE.subirT); NUBE.subirT = setTimeout(() => nubeSubir(), 150);
}
async function nubeSubir() {
  if (NUBE.subiendo || !NUBE.pend.size || !NUBE.sesion) return;
  NUBE.subiendo = true; pintarEstadoNube();
  const quitar = (k, v) => { if (NUBE.pend.get(k) === v) NUBE.pend.delete(k); };
  try {
    while (NUBE.pend.size) {
      const lote = [...NUBE.pend.entries()].slice(0, 25);
      try { await nubeFetch('/datos', { method: 'POST', body: { items: lote.map(([, v]) => v) }, timeout: 60000 }); lote.forEach(([k, v]) => quitar(k, v)); }
      catch (e) {
        if (e.red || e.status === 401 || e.status === 429 || e.status >= 500) throw e;
        // la nube rechazó algo del lote: se envía uno por uno y se descarta solo lo rechazado
        for (const [k, v] of lote) {
          try { await nubeFetch('/datos', { method: 'POST', body: { items: [v] } }); }
          catch (e2) { if (e2.red || e2.status === 401 || e2.status >= 500) throw e2; toast(`La nube no aceptó un cambio: ${e2.message}`, 'bad'); }
          quitar(k, v);
        }
      }
      persistNube();
    }
    NUBE.offline = false;
  } catch (e) { if (e.red) NUBE.offline = true; }
  finally { NUBE.subiendo = false; persistNube(); pintarEstadoNube(); }
}
// Primera conexión de la empresa: si la nube aún no tiene configuración, se sube la de este equipo (datos de Master Steel, cuentas, responsables, logo).
function configInicialNube() {
  if (NUBE.cfgNube || !puedeConfig() || NUBE.pend.has('config:empresa')) return;
  const loc = leerLocalGuardado();
  const c = loc?.cfg ? limpiarCfgDemo(loc.cfg) : clone(DB.cfg);
  if (NUBE.sesion?.empresa?.ruc && !c.empresa.ruc) c.empresa.ruc = NUBE.sesion.empresa.ruc;
  DB.cfg = mergeCfg(c); NUBE.cfgNube = true;
  nubeEncolar('config', { ...clone(DB.cfg), id: 'empresa' });
  if (loc?.logo?.dataUrl && !DB.logo) { DB.logo = loc.logo; nubeEncolar('config', { id: 'logo', ...loc.logo }); }
  changed();
}

function loginErr(msg) { const el = $('#login-err'); if (el) el.textContent = msg; }
async function loginIr(btn) {

async function loginInstalar(btn) {

    if (!act && !(await confirmDlg({ title: `¿Desactivar a ${u.nombre}?`, body: 'Ya no podrá ingresar y se cerrará su sesión en todos sus equipos. Sus documentos se conservan.', ok: 'Desactivar', danger: true }))) return;

  },
  'usr-copiar': async el => { try { await navigator.clipboard.writeText(el.dataset.t); toast('Mensaje copiado'); } catch { toast('No se pudo copiar. Selecciona el texto manualmente.', 'warn'); } },
  'usr-wa': () => { /* el enlace abre WhatsApp */ },
});
document.addEventListener('change', async ev => {
